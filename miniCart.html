<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Cart</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <input v-model="text" type="text"> <button @click="add">Add application</button>
        <div>
            <ul v-if="applications.length">
                <li v-for="(application,index) in applications">
                    {{application}}
                    <button @click="remove(index)">Delete</button>
                </li>
            </ul>
            <p v-else>There is no applications yet</p>
        </div>
    </div>

    <script>
        let app = {
            data() {
                return {
                    applications: [],
                    text: ""
                }
            },
            methods: {
                add() {
                    if(this.text.length){
                        this.applications.push(this.text);
                    }
                },
                remove(index) {
                    this.applications.splice(index,1);
                }
            }
        }

        Vue.createApp(app).mount('#app');
    </script>
</body>
</html>
