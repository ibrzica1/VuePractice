<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Details</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <p>Job</p>
        <button v-if="showDetails" @click="show">Hide</button> </r>
        <button v-else @click="show">Details</button> </r>
        <div v-show="showDetails">
            <p>Title: Driver</p>
            <p>Location: Munchen</p>
            <p>Salary: 3000</p>
        </div>
    </div>

    <script>
        let app = {
            data() {
                return {
                    showDetails: false
                }
            },
            methods: {
                show() {
                    this.showDetails = ! this.showDetails;
                }
            }
        }

        Vue.createApp(app).mount('#app');
    </script>
</body>
