<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Job Completed</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <p v-if="isLoading">Loading...</p>
        <p v-if="errorMessage">{{errorMessage}}</p>
        <div v-else>
            <p v-for="job in jobs">{{job.title}}</p>
        </div>
    </div>

    <script type="module">
        import filteredJobList from "./js/components/filteredJobsList.js";

        let app = {
            data() {
                return {
                    jobs: [],
                    isLoading: false,
                    errorMessage: null
                }
            },
            components: {
                
            },
            methods: {
                fetchJobs() {
                    this.isLoading = true;
                    this.errorMessage = null;
                    fetch('http://localhost:3000/jobs')
                    .then(response => {
                        if(!response.ok){
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        return this.jobs = data ? data : [];
                    })
                    .catch(error => {
                        this.errorMessage = error.message; 
                    }).
                    finally(() => {
                        this.isLoading = false 
                    });
                }
            },
            computed: {
                
            },
            mounted() {
                this.fetchJobs();
            }
            
        }

        Vue.createApp(app).mount('#app');
    </script>
</body>
</html>
