<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Cart</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <label for="">Jobs</label>
            <div v-for="job in jobs">
                <job-card :job="job"></job-card>
            </div>
        
    </div>

    <script type="module">
        import jobCard from "./js/components/jobCard.js";

        let app = {
            data() {
                return {
                    jobs: [
                        {id:1, title:'Wash dishes', location:'Osijek', wage:23.33},
                        {id:2, title:'Mop floor', location:'Zagreb', wage:44.55},
                        {id:3, title:'Clean carpet', location:'Split', wage:55.66}
                    ]
                }
            },
            components: {
                'job-card': jobCard
            }
        }

        Vue.createApp(app).mount('#app');
    </script>
</body>
</html>
