<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Job Completed</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <input v-model="searchQuery" 
                type="text" 
                placeholder="Search jobs">
        <filtered-jobs-list :filtered-jobs="filteredJobs"></filtered-jobs-list>
    </div>

    <script type="module">
        import filteredJobList from "./js/components/filteredJobsList.js";

        let app = {
            data() {
                return {
                    searchQuery: "",
                    jobs: []
                }
            },
            components: {
                'filtered-jobs-list': filteredJobList
            },
            methods: {
                getJobs() {
                    fetch('http://localhost:3000/jobs')
                        .then(response => response.json())
                        .then(data => {
                            return this.jobs = data;
                        })
                }
            },
            computed: {
                filteredJobs() {
                    if(this.searchQuery.length > 1){
                        return this.jobs.filter(job => job.title.toLowerCase().includes(this.searchQuery.toLowerCase()));
                    }
                    return this.jobs;
                },
            },
            mounted() {
                this.getJobs();
            }
        }

        Vue.createApp(app).mount('#app');
    </script>
</body>
</html>
