<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Job Completed</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <label for="">Jobs</label>
        <ul v-if="jobs.length">
            <li v-for="job in jobs">{{job.title}} 
                <span v-if="job.active">ACTIVE</span>
                <span v-else>INACTIVE</span>
            </li>
        </ul>
        <p v-else>No available jobs</p>
    </div>

    <script>
        let app = {
            data() {
                return {
                    jobs: [
                        {id:1, title:'Wash dishes', active:true},
                        {id:2, title:'Mop floor', active:false},
                        {id:3, title:'Clean carpet', active:false}
                    ]
                }
            }
        }

        Vue.createApp(app).mount('#app');
    </script>
</body>
</html>
