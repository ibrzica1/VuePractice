<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style>
   
</style>
</head>
<body>
    <div id="app">
        <p :style="{color: color}">{{count}}</p>
        <button @click="add">+</button>
        <button @click="sub">-</button>
        <button @click="reset">Reset</button>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    count: 0,
                    color: "black"
                };
            },

            methods: {
                add() {
                    this.count += 1;
                    if(this.count > 10){
                        this.color = "red";
                    }
                },
                sub() {
                    if(this.count > 0){
                        this.count -= 1;
                    }
                    if(this.count < 11){
                        this.color = "black";
                    }
                },
                reset() {
                    this.count = 0;
                    this.color = "black";
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
